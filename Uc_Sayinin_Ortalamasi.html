<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üç sayının ortalamasını yazdıran uygulama</title>
</head>
<body>
    <script>
        var x=Number(prompt("x:"));
        var y=Number(prompt("y:"));
        var z=Number(prompt("z:"));

        ortalama=((x+y+z)/3);

        alert("x:"+ x + "\ny:"+ y + "\nz:"+ z + "\nOrtalama:"+ortalama);

    </script>
</body>
</html>
