<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Zar Atma Uygulaması</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #e8eaf6;
            padding-top: 80px;
        }

        .kutu {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        #zar {
            font-size: 100px;
            margin: 20px;
        }

        button {
            background-color: #3949ab;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background-color: #1a237e;
        }
    </style>
</head>

<body>

    <div class="kutu">

        <h1>Zar Atma Oyunu</h1>

        <div id="zar">⚀</div>

        <h2 id="sonuc">Zar atmak için butona basınız.</h2>

        <button onclick="zarAt()">Zar At</button>

        <p>Toplam Atış: <span id="sayac">0</span></p>

    </div>

    <script>

        var atisSayisi = 0;

        function zarAt() {

            var sayi = Math.floor(Math.random() * 6) + 1;

            var zarlar = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

            document.getElementById("zar").innerHTML = zarlar[sayi - 1];

            document.getElementById("sonuc").innerHTML =
                "Gelen Sayı: " + sayi;

            atisSayisi++;

            document.getElementById("sayac").innerHTML = atisSayisi;

        }

    </script>

</body>
</html>
