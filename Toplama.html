    <title>İki sayının toplamını yazdıran uygulama</title>
</head>
<body>

    var Sayi1=Number(prompt("İlk sayıyı giriniz:"));
    var Sayi2=Number(prompt("İkinci sayıyı giriniz:"));

    alert("Toplam:"+toplam);
