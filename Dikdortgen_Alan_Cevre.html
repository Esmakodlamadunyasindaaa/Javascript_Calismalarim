<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dikdörtgenin alanını ve çevresini hesaplayıp yazdıran uygulama</title>
</head>
<body>
    <script>
    var alan,cevre,genislik,yukseklik;
    
    genislik=Number(prompt("Genişlik:"));
    yukseklik=Number(prompt("Yükseklik:"));

    alan=genislik*yukseklik;
    cevre=2*(genislik+yukseklik);

    document.write("Alan: "+ alan +"<br>" + "Çevre: "+ cevre);

    </script>
</body>
</html>
